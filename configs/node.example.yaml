node:
  name: "decentraai-node"
  mode: "balanced"
  data_dir: "~/.decentraai"

network:
  private_swarm: true
  lan_discovery: true
  dht_enabled: false
  relay_enabled: false
  bootstrap_peers: []
  max_connections: 64
  max_message_bytes: 1048576

storage:
  chunk_size_mb: 4
  hash_algorithm: "blake3"
  max_cache_gb: 100
  min_free_disk_gb: 20
  verify_full_file_after_assembly: true
  allow_unsigned_models: false
  auto_seed_verified_models: false

resources:
  cpu_max_percent: 50
  memory_max_percent: 60
  reserve_cpu_cores: 1
  reserve_ram_mb: 2048
  gpu_enabled: "auto"
  gpu_max_vram_percent: 75
  reserve_vram_mb: 1536
  stop_gpu_temperature_celsius: 83
  max_upload_mbps: 20
  max_download_mbps: 80

inference:
  enabled: "auto"
  runtime: "llama_server"
  bind_address: "127.0.0.1"
  api_auth_required: true
  allow_remote_inference: false
  max_concurrent_requests: 1
  # Smaller contexts mean faster prompt processing and a smaller KV
  # cache on CPU nodes; raise it only when you need long documents.
  max_context_tokens: 4096
  max_generated_tokens: 1024
  request_timeout_seconds: 180
  queue_max_requests: 20
  idle_model_unload_minutes: 15
  api_port: 8080
  # Sampling defaults applied when a request omits them (Q1). Small
  # models answer far more coherently with sampling + a system line.
  generation:
    temperature: 0.7
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.1
    system_prompt: "You are a helpful assistant. Answer in the same language as the user's message."

privacy:
  log_prompts: false
  log_outputs: false
  publish_exact_hardware: false
  telemetry_opt_in: false

security:
  trust_mode: "private"
  require_signed_announcements: true
  require_request_signatures: true
  ban_duration_minutes: 60
  max_invalid_chunks_per_peer: 2

# Automatic sharing (swarm start): what to do with model announcements
# from peers on the LAN. `auto` downloads and verifies every announced
# model (per-chunk BLAKE3 + Merkle gate, quarantine on corruption);
# `ask` prompts before each download; `off` ignores announcements.
sharing:
  mode: "auto"
  max_concurrent_downloads: 2

# Subscription tiers (P1): everything is free; your tier reflects your
# contribution. `models` is an allowlist of model file names; an empty
# list means "all models the node serves". Delete this section to run
# admin-token-only, like before tiers existed.
tiers:
  tier1: # guest — invited by the admin
    models: ["tinyllama.gguf"]
    rate_limit_per_minute: 10
  tier2: # contributor — shares at least one verified model
    models: []
    rate_limit_per_minute: 60
  tier3: # core — large contributions, clean reputation
    models: []
    rate_limit_per_minute: 120
