,conf:.71,rel:["gap-42"]}],gaps:[{id:"gap-42",title:"Embedding runtime optimization",research:4,status:"open"}],experiments:[{id:"exp-7",title:"v2 vs v1",result:null,status:"idle"}]};function now(){return new Date().toLocaleTimeString([],{hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"})}function phaseOf(s){if(["INCIDENT","WARNING"].includes(s))return"hold";if(["IDLE","WAITING"].includes(s))return"idle";if(s==="OBSERVING")return"observing";if(["THINKING","RESEARCHING","USING_SKILL","CALLING_MCP"].includes(s))return"diagnosing";if(["DELEGATING","EXECUTING"].includes(s))return"delegating";if(["VERIFYING","COMPLETED"].includes(s))return"verifying";if(s==="LEARNING")return"learning";return"idle"}function pathIndex(p){return{observing:0,diagnosing:1,delegating:2,verifying:3,learning:3,hold:-1,idle:-1}[p]}function setGov(s,u){state.governor=s;state.phase=phaseOf(s);if(u)state.utterance=u;app.dataset.phase=state.phase;app.dataset.live=(state.events.some(e=>e.live)||["DELEGATING","EXECUTING"].includes(s))?"true":"false"}function addMsg(role,text,caps=[]){state.messages.push({role,text,caps,t:now()})}function addEv(x){const e={id:"ex_0f3a"+String(state.events.length+1).padStart(2,"0"),open:false,live:true,done:false,elapsed:"0.0s",model:MODELS[state.model],...x};state.events.push(e);state.selectedEvent=e.id;return e}function lastEv(x){Object.assign(state.events[state.events.length-1]||{},x)}function renderPresence(){$("#utter").textContent=state.utterance;const n=pathIndex(state.phase);$("#path").innerHTML=PATH.map((x,i)=>`<li class="${i===n?"on":i<n?"done":""}">${x}</li>`).join("");$("#modelBtn").textContent=state.provider==="hybrid"?`${MODELS[state.model]} / Local`:`${MODELS[state.model]} / ${state.provider==="command-code"?"Command Code":"Local"}`}function capHtml(c,i,m){let p=c.kind==="PROPOSAL"?'<div class="policy">AI proposes → simulated Rust decision → execution</div>':"";return`<div class="cap ${c.open?"open":""}" data-kind="${c.kind}" data-cap="${m}:${
