name: Apply DecentraAI branding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  branding:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply DecentraAI logo to Command Deck
        shell: python {0}
        run: |
          from pathlib import Path

          p = Path('crates/runtime/src/dashboard.rs')
          s = p.read_text()
          old_css = '.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-weight:800;color:#04121a;font-size:15px;box-shadow:0 0 18px rgba(34,211,238,.35)}'
          new_css = '.brand-mark{width:32px;height:32px;flex:0 0 32px;border-radius:9px;display:grid;place-items:center;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.28);box-shadow:0 0 18px rgba(34,211,238,.18);overflow:hidden}.brand-mark svg{width:27px;height:27px;display:block}.brand-mark .logo-core{fill:var(--accent)}.brand-mark .logo-node{fill:#e8eef6}.brand-mark .logo-link{stroke:var(--accent);stroke-width:1.6;fill:none;opacity:.95}'
          if old_css not in s:
              raise SystemExit('expected brand CSS not found')
          s = s.replace(old_css, new_css, 1)

          old_brand = '<div class="brand"><div class="brand-mark">◆</div><div><div class="brand-name">DecentraAI</div><div class="brand-sub">command deck</div></div></div>'
          new_brand = '''<div class="brand"><div class="brand-mark" aria-label="DecentraAI logo">
            <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
              <path class="logo-link" d="M18 10h17c12 0 21 10 21 22s-9 22-21 22H18"/>
              <path class="logo-link" d="M18 10v44"/>
              <path class="logo-link" d="M28 22L42 17M28 22l14 25M28 22l13 10M28 42l13-10M28 42l14 5"/>
              <circle class="logo-node" cx="28" cy="22" r="3.8"/><circle class="logo-node" cx="28" cy="42" r="3.8"/>
              <circle class="logo-node" cx="42" cy="17" r="3.8"/><circle class="logo-node" cx="41" cy="32" r="4.3"/><circle class="logo-node" cx="42" cy="47" r="3.8"/>
              <circle class="logo-core" cx="41" cy="32" r="2.1"/>
            </svg>
          </div><div><div class="brand-name">DecentraAI</div><div class="brand-sub">execution fabric</div></div></div>'''
          if old_brand not in s:
              raise SystemExit('expected brand markup not found')
          s = s.replace(old_brand, new_brand, 1)
          s = s.replace('<title>DecentraAI dashboard</title>', '<title>DecentraAI — Command Deck</title>', 1)
          p.write_text(s)

          b = Path('docs/brand/decentraai-logo.svg')
          b.parent.mkdir(parents=True, exist_ok=True)
          b.write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc"><title id="title">DecentraAI</title><desc id="desc">D-shaped distributed execution fabric with connected compute nodes and an AI core.</desc><defs><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="256" height="256" rx="48" fill="#05070d"/><path d="M70 42h62c50 0 86 37 86 86s-36 86-86 86H70V42Z" fill="none" stroke="url(#cyan)" stroke-width="18" stroke-linejoin="round"/><g stroke="#22d3ee" stroke-width="5" fill="none" stroke-linecap="round"><path d="M92 91 145 68M92 91l53 69M92 91l49 37M92 165l49-37M92 165l53-5"/></g><g fill="#e8eef6" stroke="#22d3ee" stroke-width="4"><circle cx="92" cy="91" r="12"/><circle cx="92" cy="165" r="12"/><circle cx="145" cy="68" r="12"/><circle cx="141" cy="128" r="14"/><circle cx="145" cy="160" r="12"/></g><circle cx="141" cy="128" r="6" fill="#22d3ee"/></svg>''')
          Path('docs/brand/README.md').write_text('# DecentraAI Brand\n\nGeometric D + execution fabric identity. The dashboard uses an inline SVG so the single-binary UI keeps its no-external-assets invariant.\n')
      - name: Commit branding changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/runtime/src/dashboard.rs docs/brand
          git diff --cached --quiet || git commit -m "feat(ui): add DecentraAI execution fabric branding"
          git push
