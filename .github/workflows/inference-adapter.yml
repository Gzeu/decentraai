name: Inference adapter validation

on:
  push:
    branches: [main, 'feature/m10-inference-vertical-slice']
    paths:
      - 'crates/inference-adapter/**'
      - '.github/workflows/inference-adapter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/inference-adapter/**'
      - '.github/workflows/inference-adapter.yml'

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/inference-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
