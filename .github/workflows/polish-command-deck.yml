name: Polish DecentraAI Command Deck

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Polish dashboard visual system
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('crates/runtime/src/dashboard.rs')
          s = p.read_text()
          marker = '/* DecentraAI visual polish v1 */'
          if marker in s:
              raise SystemExit('visual polish already present')
          polish = r'''
/* DecentraAI visual polish v1 */
:root{
  --accent-glow:rgba(34,211,238,.18);
  --indigo-glow:rgba(99,102,241,.16);
  --glass:rgba(13,18,28,.72);
}
body{position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.24;background-image:linear-gradient(rgba(34,211,238,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.045) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black 0%,transparent 82%)}
body::after{content:"";position:fixed;width:520px;height:520px;right:-220px;top:18%;pointer-events:none;z-index:-1;background:radial-gradient(circle,var(--indigo-glow),transparent 68%);filter:blur(18px)}
.rail{background:linear-gradient(180deg,rgba(8,12,20,.94),rgba(7,10,17,.86));box-shadow:12px 0 50px rgba(0,0,0,.18)}
.brand{position:relative;padding:6px 8px 18px;margin-bottom:2px}
.brand::after{content:"";position:absolute;left:8px;right:8px;bottom:6px;height:1px;background:linear-gradient(90deg,transparent,var(--line-2),transparent)}
.brand-mark{width:36px;height:36px;flex-basis:36px;border-radius:11px;background:linear-gradient(145deg,rgba(34,211,238,.12),rgba(99,102,241,.09));border-color:rgba(34,211,238,.34);box-shadow:0 0 0 1px rgba(34,211,238,.04),0 0 24px rgba(34,211,238,.16),inset 0 0 18px rgba(34,211,238,.06)}
.brand-mark svg{width:30px;height:30px}
.brand-name{font-size:14px;letter-spacing:.01em}
.brand-sub{font-size:10px;letter-spacing:.16em}
.nav-item{min-height:36px;position:relative}
.nav-item.active{box-shadow:inset 3px 0 0 var(--accent),0 0 22px rgba(34,211,238,.05)}
.nav-item.active .ic{filter:drop-shadow(0 0 5px var(--accent))}
.main{padding:24px 30px 64px}
.topbar{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(34,48,72,.62)}
.topbar h1{font-size:21px;letter-spacing:-.025em;background:linear-gradient(100deg,#f5f8fc 0%,#dce8f5 48%,#7de8f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar .crumb{font-size:11px;letter-spacing:.02em}
.live-pill,.node-pill{box-shadow:0 8px 24px rgba(0,0,0,.16)}
.card{background:linear-gradient(145deg,rgba(15,21,32,.88),rgba(9,14,23,.78));border-color:rgba(34,48,72,.82);backdrop-filter:blur(10px);box-shadow:0 16px 46px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.018)}
.card:hover{border-color:rgba(34,211,238,.22);box-shadow:0 18px 52px rgba(0,0,0,.28),0 0 0 1px rgba(34,211,238,.025)}
.metric{background:linear-gradient(145deg,rgba(10,15,24,.88),rgba(8,12,20,.72));border-color:rgba(34,48,72,.72);transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.metric:hover{transform:translateY(-1px);border-color:rgba(34,211,238,.22);box-shadow:0 10px 28px rgba(0,0,0,.18)}
.metric .label{letter-spacing:.12em}
.metric .value{text-shadow:0 0 22px rgba(34,211,238,.06)}
.badge{border:1px solid rgba(255,255,255,.04)}
button.primary{box-shadow:0 8px 24px rgba(34,211,238,.12),inset 0 1px 0 rgba(255,255,255,.16)}
button.primary:hover{box-shadow:0 10px 30px rgba(34,211,238,.18)}
input,select,textarea{box-shadow:inset 0 1px 4px rgba(0,0,0,.18)}
input:hover,select:hover,textarea:hover{border-color:rgba(34,48,72,.95)}
.loading .spinner{box-shadow:0 0 10px rgba(34,211,238,.14)}
@media(max-width:900px){.main{padding:18px 16px 48px}.topbar{padding-bottom:11px}.topbar h1{font-size:18px}}
'''
          if '</style>' not in s:
              raise SystemExit('style closing tag not found')
          s = s.replace('</style>', polish + '</style>', 1)
          p.write_text(s)
      - name: Commit polished UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/runtime/src/dashboard.rs
          git diff --cached --quiet || git commit -m "feat(ui): polish Command Deck visual system"
          git push
