name: M10 validation

on:
  push:
    branches: [main, 'feature/m10-inference-vertical-slice']
  pull_request:
    branches: [main]

concurrency:
  group: m10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  contract:
    name: Contract and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate OpenAPI YAML (inline — external action was removed from the registry)
        run: |
          test -f docs/api/m10-openapi.yaml
          python3 - <<'PY'
          import sys, yaml
          spec = yaml.safe_load(open("docs/api/m10-openapi.yaml"))
          assert isinstance(spec, dict), "spec is not a mapping"
          for key in ("openapi", "info", "paths"):
              assert key in spec, f"missing required OpenAPI key: {key}"
          print("OpenAPI spec OK:", spec.get("info", {}).get("title", "?"))
          PY
      - name: Check accidental secret patterns
        run: |
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})' \
            --exclude-dir=.git --exclude='*.lock' .
