name: M10 validation

on:
  push:
    branches: [main, 'feature/m10-inference-vertical-slice']
  pull_request:
    branches: [main]

concurrency:
  group: m10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  contract:
    name: Contract and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI YAML
        uses: char0nwt/openapi-validator-action@v0.6.0
        with:
          file-path: docs/api/m10-openapi.yaml
      - name: Check accidental secret patterns
        run: |
          ! grep -RInE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})' \
            --exclude-dir=.git --exclude='*.lock' .
