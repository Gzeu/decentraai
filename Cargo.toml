[workspace]
members = [
  "crates/audit",
  "crates/compute",
  "crates/config",
  "crates/discovery",
  "crates/distributed",
  "crates/fabric",
  "crates/identity",
  "crates/inference-adapter",
  "crates/manifest",
  "crates/monitoring",
  "crates/node-cli",
  "crates/p2p",
  "crates/p2p-invoke",
  "crates/protocol",
  "crates/registry",
  "crates/runtime",
  "crates/system-probe",
  "crates/tokens",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
authors = ["DecentraAI Contributors"]
repository = "https://github.com/Gzeu/decentraai"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
blake3 = "1.6"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "3.0"
futures = "0.3"
hex = "0.4"
libp2p = { version = "0.54", features = ["macros", "mdns", "tokio", "noise", "yamux", "tcp", "request-response", "serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusqlite = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sysinfo = "0.33"
tempfile = "3.15"
thiserror = "2.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time", "io-util", "fs", "sync", "signal", "process", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
