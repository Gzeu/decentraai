[workspace]
resolver = "2"
members = [
    "crates/audit",
    "crates/config",
    "crates/identity",
    "crates/manifest",
    "crates/node-cli",
    "crates/p2p",
    "crates/protocol",
    "crates/registry",
    "crates/runtime",
    "crates/system-probe",
    "crates/tokens",
    "crates/discovery",
]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
libp2p = { version = "0.54", features = ["full", "plaintext", "gossipsub", "mdns", "kad", "identify", "ping", "noise", "yamux", "dns", "quic", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
sha2 = "0.10"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
mdns-sd = "0.13"
