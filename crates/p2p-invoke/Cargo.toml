[package]
name = "decentraai-p2p-invoke"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
libp2p = { workspace = true }
decentraai-p2p = { path = "../p2p" }
decentraai-protocol = { path = "../protocol" }
decentraai-identity = { path = "../identity" }
