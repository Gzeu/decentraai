[package]
name = "discovery"
version = "0.1.0"
edition = "2021"
description = "Worker discovery via mDNS and P2P gossip for DecentraAI"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
libp2p = { workspace = true }
identity = { path = "../identity" }
p2p = { path = "../p2p" }
system-probe = { path = "../system-probe" }
tracing = "0.1"
mdns-sd = "0.13"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
