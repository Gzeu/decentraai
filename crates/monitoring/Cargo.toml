[package]
name = "monitoring"
version = "0.1.0"
edition = "2021"
description = "Structured logging and metrics collection for DecentraAI"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"

[dependencies.tokio]
version = "1.0"
features = ["full"]
