services:
  coordinator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["decentraai", "node", "--config", "/etc/decentraai/coordinator.yaml"]
    ports:
      - "8080:8080"
      - "4001:4001"
    volumes:
      - coordinator-data:/var/lib/decentraai
      - ./config/coordinator.yaml:/etc/decentraai/coordinator.yaml:ro
    environment:
      DECENTRAAI_LOG: info
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["decentraai", "worker", "--config", "/etc/decentraai/worker.yaml"]
    depends_on:
      coordinator:
        condition: service_healthy
      llama:
        condition: service_started
    ports:
      - "4002:4001"
    volumes:
      - worker-data:/var/lib/decentraai
      - ./config/worker.yaml:/etc/decentraai/worker.yaml:ro
    environment:
      DECENTRAAI_LOG: info
      LLAMA_SERVER_URL: http://llama:8081

  llama:
    image: ghcr.io/ggerganov/llama.cpp:server
    command: ["--host", "0.0.0.0", "--port", "8081", "--model", "/models/model.gguf"]
    volumes:
      - ./models:/models:ro
    expose:
      - "8081"

volumes:
  coordinator-data:
  worker-data:
